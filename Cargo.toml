[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
testsuite-generator = { path = "crates/testsuite-generator" }
robotool-harness = { path = "crates/robotool-harness" }
